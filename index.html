<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Штормовий Рибал — Storm Fishers</title>
    <style>
      html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: #06121e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-user-select: none; user-select: none;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      #vignette {
        position: fixed; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(2, 8, 14, 0.55) 100%);
      }
      #loading {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(180deg, #06121e 0%, #0a2233 100%);
        color: #cfe8ef; gap: 18px;
        transition: opacity 0.6s ease;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading h1 { font-size: 34px; letter-spacing: 4px; margin: 0; color: #eaf6f8; font-weight: 800; }
      #loading p { margin: 0; opacity: 0.7; }
      .spinner {
        width: 42px; height: 42px; border-radius: 50%;
        border: 3px solid rgba(55, 198, 181, 0.2); border-top-color: #37c6b5;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>
    <div id="loading">
      <h1>ШТОРМОВИЙ РИБАЛ</h1>
      <div class="spinner"></div>
      <p>готуємо море…</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
