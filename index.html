<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Storm Fishers — Грозова рибалка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: #06121e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-user-select: none; user-select: none;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      #vignette {
        position: fixed; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(2, 8, 14, 0.55) 100%);
      }
      #loading {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(180deg, #f6c79a 0%, #e98f73 45%, #5d5a8a 100%);
        color: #fff; gap: 22px;
        font-family: 'Unbounded', 'Manrope', -apple-system, sans-serif;
        transition: opacity 0.9s ease;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading h1 { font-size: 40px; letter-spacing: 2px; margin: 0; font-weight: 800; text-align: center; line-height: 1.05; text-shadow: 0 4px 30px rgba(80, 40, 60, 0.35); }
      #loading p { margin: 0; opacity: 0.85; font-family: 'Manrope', sans-serif; font-weight: 700; letter-spacing: 1px; }
      .spinner {
        width: 46px; height: 14px; border-radius: 50%;
        border-bottom: 3px solid rgba(255, 255, 255, 0.9);
        animation: bob 1.6s ease-in-out infinite;
      }
      @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-8px) rotate(6deg); } }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>
    <div id="loading">
      <h1 id="loading-title">Storm<br>Fishers</h1>
      <div class="spinner"></div>
      <p id="loading-text">preparing the sea…</p>
    </div>
    <script>
      // мова екрана завантаження — до старту гри (як у src/core/i18n.ts)
      (function () {
        var l = null;
        try { l = new URLSearchParams(location.search).get('lang'); } catch (e) {}
        if (l !== 'uk' && l !== 'ua' && l !== 'en') { try { l = localStorage.getItem('storm-lang'); } catch (e) {} }
        if (l === 'uk' || l === 'ua') {
          document.documentElement.lang = 'uk';
          document.title = 'Грозова рибалка — Storm Fishers';
          document.getElementById('loading-title').innerHTML = 'Грозова<br>рибалка';
          document.getElementById('loading-text').textContent = 'готуємо море…';
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
