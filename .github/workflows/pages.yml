name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # превʼю експериментальних гілок: /preview/<гілка>/ (якщо гілка є)
      - name: Build branch previews
        run: |
          for b in clouds-sot; do
            if git fetch --depth=1 origin "$b"; then
              rm -rf "/tmp/pv-$b" && git worktree add "/tmp/pv-$b" FETCH_HEAD
              (cd "/tmp/pv-$b" && npm ci && npx vite build --base ./ --outDir "$GITHUB_WORKSPACE/dist/preview/$b")
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
